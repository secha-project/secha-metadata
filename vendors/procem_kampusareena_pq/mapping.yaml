  - {key: "23594", quantity: harmonic_voltage, phase: L2, harmonic_order: 5, unit: percent, desc: "LV3_EVCharging_U5L2"}
  - {key: "23596", quantity: harmonic_voltage, phase: L2, harmonic_order: 7, unit: percent, desc: "LV3_EVCharging_U7L2"}
  - {key: "23642", quantity: harmonic_voltage, phase: L3, harmonic_order: 3, unit: percent, desc: "LV3_EVCharging_U3L3"}
  - {key: "23644", quantity: harmonic_voltage, phase: L3, harmonic_order: 5, unit: percent, desc: "LV3_EVCharging_U5L3"}
