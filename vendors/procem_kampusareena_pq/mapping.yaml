  - {key: "23840", quantity: voltage_unbalance_negative_seq, phase: none, unit: percent, desc: "LV3_EVCharging_U2U1"}
  - {key: "23841", quantity: voltage_unbalance_zero_seq, phase: none, unit: percent, desc: "LV3_EVCharging_U0U1"}

  # --- individual voltage harmonics 3/5/7 (mirrors the Electrix slice orders) ----
  # In this long source each (order, phase) is its own rtl_id, so harmonics are
  # explicit rows carrying harmonic_order (wide sources use `generated` patterns).
  - {key: "23542", quantity: harmonic_voltage, phase: L1, harmonic_order: 3, unit: percent, desc: "LV3_EVCharging_U3L1"}
  - {key: "23544", quantity: harmonic_voltage, phase: L1, harmonic_order: 5, unit: percent, desc: "LV3_EVCharging_U5L1"}
  - {key: "23546", quantity: harmonic_voltage, phase: L1, harmonic_order: 7, unit: percent, desc: "LV3_EVCharging_U7L1"}
