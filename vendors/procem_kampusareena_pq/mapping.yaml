  - {key: "23944", quantity: energy_active_import, phase: none, aggregation: counter, unit: kWh, desc: "LV3_EVCharging_EP_plus"}
  - {key: "23945", quantity: energy_active_export, phase: none, aggregation: counter, unit: kWh, desc: "LV3_EVCharging_EP_minus"}
  - {key: "23946", quantity: energy_reactive_import, phase: none, variant: fryze, aggregation: counter, unit: kvarh, desc: "LV3_EVCharging_EQf_plus"}
  - {key: "23947", quantity: energy_reactive_export, phase: none, variant: fryze, aggregation: counter, unit: kvarh, desc: "LV3_EVCharging_EQf_minus"}
  - {key: "23948", quantity: energy_reactive_import, phase: none, variant: fundamental, aggregation: counter, unit: kvarh, desc: "LV3_EVCharging_EQ1_plus"}
