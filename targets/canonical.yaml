# =============================================================================
# Sink binding: where/how the engine writes canonical data. SHARED across all
# vendors (not per-vendor), so per-vendor files stay pure transformation knowledge.
# =============================================================================
target: canonical_measurement
catalog: secha
schema: canonical
table: measurement
format: delta
write_mode: merge                      # idempotent re-runs
merge_key: [measurement_id]
measurement_id_from:                   # deterministic surrogate (idempotency); the full identity
  # tuple INCLUDING aggregation, so min/max/mean variants of the same quantity never collide
  [source_vendor, device_id, ts_utc, quantity, phase, variant, harmonic_order, aggregation, source_row_id]
# A source with no clock time (Kempower) has ts_utc null, so source_row_id carries its
# identity; with no row key in the source, that is the row's position in its immutable
# landed payload (record.row_id_from). Existing ids are unchanged by this rule.
partition_by: [source_vendor, event_date]   # event_date is null for a source without clock time
# cluster_by: [source_vendor, device_id, ts_utc]   # Databricks liquid clustering (deferred)

# Platform conformance (learned via the Phase-3 handshake, 2026-07-14): this Unity Catalog
# (0.4, managed tables enabled) REJECTS managed-table creation without the catalog-managed
# Delta feature. The sink's generated DDL always includes these properties.
table_properties:
  delta.feature.catalogManaged: supported

# Phase-1 -> Phase-3 hand-off: canonical parquet is staged on the cluster-visible NFS and
# MERGEd from there (Spark workers cannot read a laptop; see secha-transform scripts/phase3).
# The env var carries the path, e.g. /net/nfs/data/secha/canonical-staging
staging:
  root_env: SECHA_STAGING_ROOT

# Wide serving views, config-as-code: each serving/<name>.sql holds ONE SELECT over the
# canonical fact (referenced as {canonical}); the sink wraps it per serving_mode.
# serving_mode (platform fact, learned 2026-07-15): this Unity Catalog Spark connector
# (0.4.0) has no view ability (MISSING_CATALOG_ABILITY.VIEWS), so serving definitions are
# materialised as Delta TABLES (refreshed by `secha-transform delta-views`). Flip to
# `view` once the connector supports views; the serving/*.sql definitions do not change.
serving_schema: serving
serving_mode: table

dimensions:
  device:           {schema: canonical, table: device,           merge_key: [device_id]}
  location:         {schema: canonical, table: location,         merge_key: [location_id]}
  charging_session: {schema: canonical, table: charging_session, merge_key: [session_id]}

# Reference dimensions: published DIRECTLY from the rulebook (not from fact data), so
# consumers JOIN the long fact for human-readable semantics + standards, e.g.
#   SELECT m.*, q.description, q.standard_ref
#   FROM secha.canonical.measurement m JOIN secha.canonical.quantity q USING (quantity)
# This is the correct home for per-quantity meaning in a LONG model (the semantics live in
# rows, not columns), and it sidesteps the UC 0.4 column-comment limitation entirely. Each
# `from: <attr>` maps a vocabulary attribute to a column; `from: __key__` is the dict key.
reference_dimensions:
  quantity:
    schema: canonical
    source_vocabulary: quantities        # bundle.vocabulary["quantities"]
    columns:
      - {name: quantity,     from: __key__,      comment: "Canonical quantity name; join key to measurement.quantity"}
      - {name: default_unit, from: default_unit, comment: "Canonical unit-registry code for this quantity"}
      - {name: standard_ref, from: standard_ref, comment: "Aligned measurement standard (IEC / IEEE / EN), where one exists"}
      - {name: description,  from: description,  comment: "Human-readable definition of the quantity"}
